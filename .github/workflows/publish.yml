name: Publish build results
permissions: {}
on:
  workflow_run:
    types: completed
    workflows:
      - Continuous integration

jobs:
  publish-test-results:
    name: Publish test results
    runs-on: ubuntu-latest
    if: contains(fromJSON('["failure", "success", "neutral"]'), github.event.workflow_run.conclusion)
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{github.event.workflow_run.head_sha}}
          repository: ${{github.event.workflow_run.head_repository.owner.login}}/${{github.event.workflow_run.head_repository.name}}
      - name: Download test results
        uses: actions/download-artifact@v8.0.0
        with:
          run-id: ${{github.event.workflow_run.id}}
          name: test-results
          github-token: ${{secrets.GITHUB_TOKEN}}
      - name: Create token for check writing
        uses: actions/create-github-app-token@v2.2.1
        id: token
        with:
          app-id: ${{vars.GH_APP_CLIENT_ID}}
          private-key: ${{secrets.GH_APP_PRIVATE_KEY}}
          permission-actions: read
          permission-checks: write
      - name: Publish test results as check suite
        uses: dorny/test-reporter@v2.5.0
        with:
          name: Test results
          path: "**/test-results/*.trx"
          reporter: dotnet-trx
          token: ${{steps.token.outputs.token}}
          use-actions-summary: false

  publish-packages:
    name: Publish packages
    runs-on: ubuntu-latest
    if: contains(fromJSON('["success", "neutral"]'), github.event.workflow_run.conclusion)
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup .NET sdk
        uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: 8.0.x
      - name: Download packages
        uses: actions/download-artifact@v8.0.0
        with:
          run-id: ${{github.event.workflow_run.id}}
          name: packages
          path: packages
          github-token: ${{secrets.GITHUB_TOKEN}}
      - name: Publish packages
        env:
          TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          for PKG in packages/*.nupkg; do
            dotnet nuget push --skip-duplicate -k "$TOKEN" $PKG
          done

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - publish-test-results
      - publish-packages
    if: ${{contains(fromJSON('["success", "neutral"]'), github.event.workflow_run.conclusion) && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')}}
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      RELEASE_NAME: ${{github.event.workflow_run.head_branch}}
    steps:
      - name: Extract version
        id: version
        run: echo "release_version=$(echo "$RELEASE_NAME" | sed -e "s/v//")" >> $GITHUB_OUTPUT
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{github.event.workflow_run.head_sha}}
      - name: Setup .NET sdk
        uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: 8.0.x
      - name: Download packages
        uses: actions/download-artifact@v8.0.0
        with:
          run-id: ${{github.event.workflow_run.id}}
          name: packages
          path: packages
          github-token: ${{secrets.GITHUB_TOKEN}}
      - name: Generate software bill of materials
        id: sbom
        uses: advanced-security/generate-sbom-action@v1.1
      - name: Attest artifacts
        uses: actions/attest-sbom@v4.0.0
        with:
          subject-path: packages/*.nupkg
          sbom-path: ${{steps.sbom.outputs.fileName}}
      - name: Extract release notes
        id: notes
        env:
          RELEASE_VERSION: ${{steps.version.outputs.release_version}}
        run: |
          gawk -v RELEASE_VERSION="$RELEASE_VERSION" '
            BEGIN { RS="\r?\n"; print "release_notes<<EOF"}
            !HEADING && $0 == ("# Version " RELEASE_VERSION) { HEADING=1; next}
            HEADING && $0 ~ /^# +.*$/ { HEADING=0}
            HEADING { print $0; }
            END { print "EOF"}
          ' CHANGELOG.md >> $GITHUB_OUTPUT
      - name: Create token for release
        uses: actions/create-github-app-token@v2.2.1
        id: token
        with:
          app-id: ${{vars.GH_APP_CLIENT_ID}}
          private-key: ${{secrets.GH_APP_PRIVATE_KEY}}
          permission-contents: write
      - name: Nuget login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: webczat
      - name: Publish packages
        env:
          TOKEN: ${{steps.nuget.outputs.NUGET_API_KEY}}
        run: |
          for PKG in packages/*.nupkg; do
            dotnet nuget push --skip-duplicate --source nuget -k "$TOKEN" $PKG
          done
      - name: Create release
        env:
          GH_TOKEN: ${{steps.token.outputs.token}}
          RELEASE_NOTES: ${{steps.notes.outputs.release_notes}}
          PRERELEASE: ${{contains(env.RELEASE_NAME, '-')}}
        run: gh release create --verify-tag "$RELEASE_NAME" --notes "$RELEASE_NOTES" --prerelease="$PRERELEASE"
